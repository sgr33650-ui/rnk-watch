<style>
/* Layout: établi de dessinateur. Bibliothèque à gauche, plan de travail 240×240 au centre, réglages à droite. */
:root{
  --bg:#121315; --panel:#1a1b1e; --raise:#232529; --line:#2f3135;
  --fg:#e8e4da; --dim:#8f8c84; --brand:#c2383d; --brand-fg:#ffffff;
  --sel:#6cc3d5; --ok:#5fa77a; --warn:#d9a441; --bad:#d9645f;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);padding-inline:16px;padding-block:12px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand small{font-weight:500;color:var(--dim);letter-spacing:.14em;font-size:13px}
.name{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 160px;max-width:300px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.sep{width:1px;height:22px;background:var(--line);margin-inline:4px}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;min-height:34px;font-weight:500}
.btn:hover{border-color:#44474d}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.on{border-color:var(--sel);color:var(--sel)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
.ico{width:34px;height:34px;padding:0;justify-content:center}
.ico svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.work{flex:1;min-height:0;display:grid;grid-template-columns:268px minmax(0,1fr) 296px;gap:12px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 6px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brand)}
.sbody{padding:12px;overflow:auto;min-height:0;flex:1}
.sh{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;font-weight:600}
.sh:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.card:hover{border-color:var(--brand)}
.card b{font-weight:600;font-size:13px;line-height:1.2}
.card i{font-style:normal;color:var(--dim);font-size:12px;line-height:1.2}
.thumb svg{display:block;border-radius:6px;max-width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0;gap:8px}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.stagebar h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stagebar h2 span{color:var(--dim);font-weight:500;font-size:13px;margin-left:6px;letter-spacing:.1em}
.canvasarea{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;display:flex;background-color:#0e0f10;background-image:radial-gradient(#26282c 1px,transparent 1px);background-size:18px 18px}
.device{margin:auto;padding:14px;border-radius:30px;background:linear-gradient(150deg,#2b2c30,#0b0b0c 45%,#232427);border:1px solid #34363b;box-shadow:0 18px 40px rgba(0,0,0,.5)}
#cv{display:block;touch-action:none;background:#000;user-select:none;-webkit-user-select:none}
.pages{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:center}
.pg{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim);max-width:92px}
.pg[aria-current="true"]{border-color:var(--brand);color:var(--fg)}
.pg svg{display:block;border-radius:4px}
.pg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.fld{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:6px}
.fld>span{color:var(--dim);font-size:13px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
.fld input[type=range]{width:100%;accent-color:var(--brand)}
.fld.chk{grid-template-columns:20px minmax(0,1fr)}
.fld.chk input{accent-color:var(--brand);width:16px;height:16px}
.fld.chk>span{order:2;color:var(--fg)}
.geo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
.geo label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.geo input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:12.5px;color:var(--fg)}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw button{width:22px;height:22px;border-radius:5px;border:1px solid #4a4d53;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--sel);outline-offset:1px}
.sw button.none{background:repeating-linear-gradient(45deg,#2a2c30 0 4px,#16171a 4px 8px)}
.sw input[type=color]{width:26px;height:24px;padding:0;border:1px solid #4a4d53;border-radius:5px;background:none}
.note{font-size:12.5px;color:var(--dim);margin:4px 0 10px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--warn);color:var(--warn);margin-left:4px;letter-spacing:.04em}
.layer{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:6px;border:1px solid transparent}
.layer[aria-current="true"]{background:var(--raise);border-color:var(--sel)}
.layer .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .mini{width:26px;height:26px;border:0;background:none;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:4px}
.layer .mini:hover{color:var(--fg);background:var(--line)}
.layer .mini[aria-pressed="true"]{color:var(--fg)}
.layer .mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.log{background:#0c0d0e;border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:12px;padding:8px;height:130px;overflow:auto;white-space:pre-wrap;color:#b9b6ad}
.prog{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:var(--brand)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px}
.dot.on{background:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:40;max-width:calc(100% - 32px)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.dlg textarea{width:100%;height:220px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:12px;padding:8px}
.dlg h3{margin:0;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:980px){
  html,body{height:auto}
  .app{height:auto}
  .work{display:flex;flex-direction:column}
  .stage{order:-1}
  .side{max-height:none}
  .sbody{max-height:70vh}
  .canvasarea{min-height:0}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</div>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* ========== Outils ========== */
var FD="'Barlow Condensed','Arial Narrow',sans-serif", FS="'Barlow','Helvetica Neue',Arial,sans-serif", FM="'JetBrains Mono',ui-monospace,monospace";

var clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};
var pad2=function(n){return String(Math.round(n)).padStart(2,'0')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

function hex2rgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');var n=parseInt(h,16);return isNaN(n)?[0,0,0]:[(n>>16)&255,(n>>8)&255,n&255]}

function shade(c,k){var a=hex2rgb(c);return rgb2hex(a[0]*k,a[1]*k,a[2]*k)}

};

/* ========== Données de la montre (aperçu) ========== */
var JOURS=['DIM','LUN','MAR','MER','JEU','VEN','SAM'], MOIS=['JAN','FÉV','MAR','AVR','MAI','JUIN','JUIL','AOÛ','SEP','OCT','NOV','DÉC'];

function liveData(base){
  var d=new Date(), D=Object.assign({},base);
  D.hour=d.getHours();D.minute=d.getMinutes();D.second=d.getSeconds();
  D.jour=JOURS[d.getDay()];D.journ=pad2(d.getDate());D.mois=MOIS[d.getMonth()];
  return D;
}
function bindText(b,el,D){
  switch(b){
    case 'heure':return pad2(D.hour);
    case 'minute':return pad2(D.minute);
    case 'seconde':return pad2(D.second);
    case 'hm':return pad2(D.hour)+':'+pad2(D.minute);
    case 'date':return D.jour+' '+D.journ+' '+D.mois;
    case 'jour':return D.jour;
    case 'journ':return D.journ;
    case 'mois':return D.mois;
    case 'batt':return Math.round(D.battery)+'%';
    case 'speed':return String(Math.round(D.speed));
    case 'km':return String(D.km);
    case 'dur':return String(D.dur);
    case 'kmh':return String(D.kmh);
    case 'artiste':return D.artiste;
    case 'titre':return D.titre;
    case 'tpos':return D.tpos;
    case 'tdur':return D.tdur;
    default:return el.text||'';
  }
}
function numBind(b,el,D){
  switch(b){
    case 'minute':return D.minute;
    case 'seconde':return D.second;
    case 'heure12':return (D.hour%12)+D.minute/60;
    case 'battery':return D.battery;
    case 'speed':return D.speed;
    default:return Number(el.value)||0;
  }
}

var FONT_URL='https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap';

async function embedFonts(){
  if(FONT_CSS!==null)return FONT_CSS;
  try{
    var css=await (await fetch(FONT_URL)).text(),re=/\/\*\s*([\w-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g,m,jobs=[];
    while((m=re.exec(css))){
      if(m[1]!=='latin')continue;
      (function(block){
        var u=/url\(([^)]+)\)/.exec(block);
        if(!u)return;
        var url=u[1].replace(/['"]/g,'');
        jobs.push(fetch(url).then(function(r){return r.arrayBuffer()}).then(function(buf){return block.replace(/url\([^)]+\)\s*format\([^)]+\)/,'url(data:font/woff2;base64,'+b64(buf)+') format("woff2")')}));
      })(m[2]);
    }
    var blocks=await Promise.all(jobs);
    if(blocks.length){FONT_CSS=blocks.join('\n');return FONT_CSS}
  }catch(e){}

}
function isDynamic(e){

  var body=renderPage(pg,th,dataNow(),'x');

  var bg=round?'':'<rect width="'+W+'" height="'+H+'" fill="'+th.bg+'"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><defs>'+defs+'</defs><g'+(round?' clip-path="url(#xclip)"':'')+'>'+bg+'<g transform="translate('+f1(tx)+' '+f1(ty)+') scale('+k.toFixed(5)+')">'+body+'</g></g></svg>';

function wlog(m){

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function waitLine(prefix,ms){
  return new Promise(function(res){
    var w={prefix:prefix,res:res};WATCH.waiters.push(w);
    setTimeout(function(){var i=WATCH.waiters.indexOf(w);if(i>=0){WATCH.waiters.splice(i,1);res(null)}},ms);
  });
}
function onLine(l){
  wlog('< '+l);
  for(var i=0;i<WATCH.waiters.length;i++){var w=WATCH.waiters[i];var k=l.indexOf(w.prefix);if(k>=0){WATCH.waiters.splice(i,1);w.res(l.slice(k));return}}

async function readLoop(){
  var buf='';

    while(WATCH.reader){
      var r=await WATCH.reader.read();if(r.done)break;
      buf+=r.value;var parts=buf.split(/\r?\n/);buf=parts.pop();
      parts.forEach(function(l){if(l)onLine(l)});
    }
  }catch(e){}
}
async function wConnect(){

  try{
    var port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    WATCH.port=port;
    var dec=new TextDecoderStream();port.readable.pipeTo(dec.writable).catch(function(){});
    WATCH.reader=dec.readable.getReader();
    WATCH.writer=port.writable.getWriter();
    WATCH.connected=true;wlog('Port ouvert à 115200 bauds.');wstate();readLoop();
  }catch(e){
    var m=(e&&e.name==='NotFoundError')?'Aucun port choisi.':((e&&e.name==='SecurityError')?'L’accès USB est bloqué dans cette fenêtre. Ouvre l’atelier dans un onglet Chrome ou Edge sur ordinateur.':'Connexion impossible : '+(e&&e.message?e.message:e));
    wlog(m);toast(m);
  }
}
async function wDisc(){
  try{if(WATCH.reader){var r=WATCH.reader;WATCH.reader=null;await r.cancel().catch(function(){})}}catch(e){}
  try{if(WATCH.writer){WATCH.writer.releaseLock();WATCH.writer=null}}catch(e){}
  try{if(WATCH.port)await WATCH.port.close()}catch(e){}
  WATCH.port=null;WATCH.connected=false;wlog('Déconnectée.');wstate();
}

}
async function wPing(){

async function wTime(){
  if(!WATCH.connected)return;

  wlog('> '+cmd);await wWrite(cmd+'\n');
  var l=await waitLine('RNK:OK',1500);
  if(l)toast('Heure de la montre réglée');else{wlog('Pas de réponse.');toast('Pas de réponse du firmware')}
}
async function wSend(){
  if(!WATCH.connected||WATCH.busy)return;
  WATCH.busy=true;renderWatchTab();
  var bar=function(p){var b=document.getElementById('wprog');if(b)b.style.width=p+'%'};
  try{
    var json=JSON.stringify(compile()),bytes=new TextEncoder().encode(json),crc=crc32(bytes);
    var alive=null;
    for(var t=0;t<5&&!alive;t++){wlog('> RNK:PING');await wWrite('\nRNK:PING\n');alive=await waitLine('RNK:PONG',1500)}
    if(!alive){wlog('La montre ne répond pas au test. Attends qu’elle ait fini de démarrer (écran allumé), puis réessaie.');toast('La montre ne répond pas');return}
    await sleep(300);
    wlog('> RNK:BEGIN '+bytes.length+' '+crc);await wWrite('RNK:BEGIN '+bytes.length+' '+crc+'\n');
    var ready=await waitLine('RNK:READY',4000);
    if(!ready){wlog('Pas de réponse : l’envoi est annulé. Le firmware RNK Runtime doit tourner sur la montre.');toast('La montre ne répond pas');return}
    var CH=256;
    for(var i=0;i<bytes.length;i+=CH){await WATCH.writer.write(bytes.slice(i,i+CH));bar(Math.round(Math.min(i+CH,bytes.length)/bytes.length*100));await sleep(6)}
    await wWrite('\nRNK:END\n');wlog('> RNK:END');
    var ok=await waitLine('RNK:OK',6000);
    if(ok){toast('Cadrans installés sur la montre');wlog('Installation confirmée.')}
    else{wlog('Aucune confirmation reçue. Vérifie la montre.');toast('Envoi non confirmé')}
  }catch(e){wlog('Erreur : '+(e&&e.message?e.message:e));toast('Envoi interrompu')}
  finally{WATCH.busy=false;bar(0);if(S.tabR==='watch')renderWatchTab()}
}

/* ========== Actions ========== */
function addPage(p){S.pages.splice(S.cur+1,0,p);S.cur=S.cur+1;S.sel=null;commit();renderAll()}
function moveLayer(id,dir){
  var els=page().elements,i=els.findIndex(function(e){return e.id===id}),j=i+dir;
  if(i<0||j<0||j>=els.length)return;var t=els[i];els[i]=els[j];els[j]=t;commit();renderLayers();renderContent();renderPages();
}
function select(id){S.sel=id;renderOverlay();if(S.tabL==='layers')renderLeft();if(S.tabR==='props')renderProps();else if(id){S.tabR='props';renderRight()}}
function goPageByName(n){var i=S.pages.findIndex(function(p){return p.name===n});if(i>=0){S.cur=i;S.sel=null;renderAll()}}
var ACT={
  undo:undo,redo:redo,
  zoomIn:function(){S.zoom=Math.min(4,Math.round((S.zoom+.25)*100)/100);renderTop();renderStage()},
  zoomOut:function(){S.zoom=Math.max(1,Math.round((S.zoom-.25)*100)/100);renderTop();renderStage()},
  toggleGrid:function(){S.grid=!S.grid;renderTop();renderOverlay()},
  toggleSnap:function(){S.snap=!S.snap;renderStagebar()},
  toggleTest:function(){S.test=!S.test;if(S.test)S.sel=null;renderAll()},
  testBtn:function(){var i=S.pages.findIndex(function(p){return p.kind==='appli'});if(i>=0){S.cur=i;renderAll()}},
  tabL:function(a){S.tabL=a.dataset.v;renderLeft()},
  tabR:function(a){S.tabR=a.dataset.v;renderRight()},
  addTpl:function(a){var t=TPLS.find(function(x){return x.id===a.dataset.id});addPage(t.build());toast('Page ajoutée : '+t.name)},
  addEl:function(a){
    var t=a.dataset.id,el=mkEl(t);
    if(t==='frame'){el.lock=false}else{el.x=Math.round((240-el.w)/2);el.y=Math.round((240-el.h)/2)}
    if(t==='counter'||t==='text')el.y=100;
    page().elements.push(el);S.sel=el.id;commit();S.tabR='props';renderAll();
  },
  selectEl:function(a){select(a.dataset.id)},
  toggleVis:function(a){var e=page().elements.find(function(x){return x.id===a.dataset.id});e.vis=!e.vis;commit();renderLayers();renderContent();renderOverlay();renderPages()},
  toggleLock:function(a){var e=page().elements.find(function(x){return x.id===a.dataset.id});e.lock=!e.lock;commit();renderLayers();renderOverlay()},
  layUp:function(a){moveLayer(a.dataset.id,1)},
  layDown:function(a){moveLayer(a.dataset.id,-1)},
  delEl:function(){
    var el=selEl();if(!el)return;var els=page().elements;els.splice(els.indexOf(el),1);S.sel=null;commit();renderLeft();renderRight();renderContent();renderOverlay();renderPages();
  },
  dupEl:function(){
    var el=selEl();if(!el)return;var c=clone(el);c.id=uid();c.x+=8;c.y+=8;c.name=(el.name||LABEL[el.type])+' copie';
    var els=page().elements;els.splice(els.indexOf(el)+1,0,c);S.sel=c.id;commit();renderLeft();renderRight();renderContent();renderOverlay();renderPages();
  },
  centerH:function(){var e=selEl();if(!e)return;e.x=Math.round((240-e.w)/2);commit();renderProps();renderContent();renderOverlay();renderPages()},
  centerV:function(){var e=selEl();if(!e)return;e.y=Math.round((240-e.h)/2);commit();renderProps();renderContent();renderOverlay();renderPages()},
  setcolor:function(a){var e=selEl();if(!e)return;e[a.dataset.k]=a.dataset.v;commit();renderProps();renderContent();renderPages();renderLeft()},
  pageGo:function(a){S.cur=+a.dataset.i;S.sel=null;renderAll()},
  pageAdd:function(){addPage(mkPage('Nouvelle page','cadran','',[mkEl('frame',{lock:true})]))},
  pageDup:function(){var c=clone(page());c.id=uid();c.name=c.name+' copie';c.elements.forEach(function(e){e.id=uid()});addPage(c)},
  pageDel:function(){if(S.pages.length<2)return;S.pages.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);S.sel=null;commit();renderAll()},
  pageMgr:function(){PM.sel={};PM.ask=false;openPM()},
  pmTog:function(a){var i=a.dataset.i;if(PM.sel[i])delete PM.sel[i];else PM.sel[i]=1;PM.ask=false;openPM()},
  pmAll:function(){PM.sel={};S.pages.forEach(function(p,i){PM.sel[i]=1});PM.ask=false;openPM()},
  pmNone:function(){PM.sel={};PM.ask=false;openPM()},
  pmDel:function(){
    var n=Object.keys(PM.sel).length;if(!n)return;
    if(n>=S.pages.length){toast('Garde au moins une page.');return}
    if(!PM.ask){PM.ask=true;openPM();return}
    var cur=S.pages[S.cur];
    S.pages=S.pages.filter(function(p,i){return !PM.sel[i]});
    var k=S.pages.indexOf(cur);S.cur=k>=0?k:0;S.sel=null;PM.sel={};PM.ask=false;
    commit();closeModal();renderAll();toast(n+(n>1?' pages supprimées':' page supprimée'));
  },
  pageLeft:function(){if(S.cur>0){var t=S.pages[S.cur];S.pages[S.cur]=S.pages[S.cur-1];S.pages[S.cur-1]=t;S.cur--;commit();renderAll()}},
  pageRight:function(){if(S.cur<S.pages.length-1){var t=S.pages[S.cur];S.pages[S.cur]=S.pages[S.cur+1];S.pages[S.cur+1]=t;S.cur++;commit();renderAll()}},
  themeDup:function(){var k='t'+Date.now().toString(36),t=clone(S.themes[S.themeId]);t.name=t.name+' copie';S.themes[k]=t;S.themeId=k;commit();renderAll()},
  themeReset:function(){if(THEMES0[S.themeId]){S.themes[S.themeId]=clone(THEMES0[S.themeId]);commit();renderAll()}},
  themeDel:function(){if(!THEMES0[S.themeId]){var k=S.themeId;delete S.themes[k];S.pages.forEach(function(p){if(p.themeId===k)p.themeId=''});S.themeId='brique';commit();renderAll()}},
  impImg:function(){$('#fileImg').click()},
  clrImg:function(){var el=selEl();if(!el||el.type!=='image')return;el.src='';el.orig='';commit();renderProps();renderContent();renderPages();toast('Image retirée')},
  impJson:function(){$('#fileJson').click()},
  expProject:function(){saveFile(slug(S.name)+'.json',JSON.stringify({kind:'rnk-project',v:1,name:S.name,themeId:S.themeId,themes:S.themes,pages:S.pages},null,1))},
  expPage:function(){saveFile(slug(page().name)+'.json',JSON.stringify({kind:'rnk-page',v:1,themes:S.themes,page:page()},null,1))},
  expLayout:function(){saveFile(slug(S.name)+'-montre.json',JSON.stringify(compile()))},
  expSvg:function(){var p=page(),th=themeOf(p);saveFile(slug(p.name)+'.svg','<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="480" height="480">'+renderPage(p,th,S.preview,'x')+'</svg>')},
  expPng:expPng,
  wConnect:wConnect,wDisc:wDisc,wPing:wPing,wSend:wSend,wTime:wTime,
  fbCopy:function(){var t=$('#fbText');t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast('Copié')},function(){document.execCommand&&document.execCommand('copy')})}catch(e){try{document.execCommand('copy')}catch(x){}}},
  closeModal:closeModal
};
function applyField(t,final){
  var el=selEl();if(!el)return;var k=t.dataset.k,v;
  if(t.type==='checkbox')v=t.checked;
  else if(t.type==='number'){
    if(t.value===''){if(k==='zone'){v=null}else return}
    else{v=parseFloat(t.value);if(!isFinite(v))return;if(t.dataset.pct)v=clamp(v,0,100)/100}
  }
  else if(t.dataset.num)v=parseFloat(t.value);
  else v=t.value;
  el[k]=v;
  if(el.type==='image'&&(k==='key'||k==='tol')){procImage(el,function(){renderContent();renderPages();if(final){commit();renderProps()}});return}
  renderContent();renderOverlay();
  if(final){
    commit();renderPages();
    if(t.tagName==='SELECT'||t.type==='checkbox'||k==='name'){renderProps();renderLeft()}
  }
}
function syncGeo(){
  var el=selEl();if(!el||S.tabR!=='props')return;
  ['x','y','w','h'].forEach(function(k){var i=document.querySelector('#bodyR input[data-k="'+k+'"]');if(i&&document.activeElement!==i)i.value=f1(el[k])});
}

/* ========== Évènements ========== */
var drag=null,tst=null;
function svgPt(e){var r=$('#cv').getBoundingClientRect(),k=240/r.width;return [(e.clientX-r.left)*k,(e.clientY-r.top)*k]}
function initEvents(){
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-act]');if(!a)return;
    var fn=ACT[a.dataset.act];if(fn&&!a.disabled)fn(a,e);
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='projName'){S.name=t.value;return}
    if(t.dataset.k&&t.closest('#bodyR')&&(t.type==='number'||t.type==='text'||t.type==='color')&&!(t.type==='number'&&t.dataset.k==='name'))applyField(t,false);
    else if(t.dataset.pv){var k=t.dataset.pv;S.preview[k]=+t.value;var o=document.querySelector('[data-pvout="'+k+'"]');if(o)o.textContent=t.value;renderContent();renderPages()}
    else if(t.dataset.tk){S.themes[S.themeId][t.dataset.tk]=t.value;renderContent();renderPages()}
    else if(t.dataset.tname){S.themes[S.themeId].name=t.value}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='projName'){S.name=t.value||'Mon projet';commit();return}
    if(t.dataset.k&&t.closest('#bodyR'))applyField(t,true);
    else if(t.dataset.pk){var p=page();p[t.dataset.pk]=t.value;commit();renderAll()}
    else if(t.dataset.pv||t.dataset.tk){commit();if(t.dataset.tk){renderLeft()}}
    else if(t.dataset.tname){commit();renderRight()}
    else if(t.dataset.tsel){S.themeId=t.value;commit();renderAll()}
    else if(t.dataset.live){S.live=t.checked;renderContent()}
    else if(t.dataset.exp){
      var ek=t.dataset.exp;
      if(ek==='preset'){if(t.value!=='custom'){var pr=t.value.split('x');EXPORT.w=+pr[0];EXPORT.h=+pr[1]}renderWatchTab()}
      else if(ek==='w'||ek==='h'){EXPORT[ek]=clamp(Math.round(+t.value||240),64,1000);renderWatchTab()}
      else EXPORT[ek]=t.value;
    }
  });
  var cv=$('#cv');
  cv.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    if(S.test){tst={x:e.clientX,y:e.clientY,g:e.target.closest('[data-id]')};cv.setPointerCapture(e.pointerId);return}
    var pt=svgPt(e);
    if(e.target.closest('[data-handle]')){
      var el=selEl();if(el&&!el.lock){drag={mode:'resize',el:el,sx:pt[0],sy:pt[1],ow:el.w,oh:el.h,moved:false};cv.setPointerCapture(e.pointerId)}
      e.preventDefault();return;
    }
    var g=e.target.closest('[data-id]'),el2=g&&page().elements.find(function(x){return x.id===g.dataset.id});
    if(el2&&!el2.lock){select(el2.id);drag={mode:'move',el:el2,sx:pt[0],sy:pt[1],ox:el2.x,oy:el2.y,moved:false};cv.setPointerCapture(e.pointerId)}
    else{select(null)}
    e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){
    if(!drag)return;
    var pt=svgPt(e),dx=pt[0]-drag.sx,dy=pt[1]-drag.sy,el=drag.el;
    if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<.6)return;
    drag.moved=true;
    if(drag.mode==='move'){
      var nx=drag.ox+dx,ny=drag.oy+dy;
      if(S.snap&&!e.altKey){nx=Math.round(nx/4)*4;ny=Math.round(ny/4)*4}
      el.x=Math.round(nx);el.y=Math.round(ny);
    }else{
      var a=-(el.rot||0)*Math.PI/180,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
      if(SQUARE[el.type]){var s=Math.max(8,(drag.ow+drag.oh+lx+ly)/2);el.w=el.h=Math.round(s)}
      else{
        var nw=drag.ow+lx,nh=drag.oh+ly;
        if(S.snap&&!e.altKey){nw=Math.round(nw/2)*2;nh=Math.round(nh/2)*2}
        el.w=Math.max(4,Math.round(nw));el.h=Math.max(2,Math.round(nh));
      }
    }
    renderContent();renderOverlay();syncGeo();
  });
  var up=function(e){
    if(S.test&&tst){
      var dx=e.clientX-tst.x,dy=e.clientY-tst.y,t=tst;tst=null;
      if(Math.abs(dx)<10&&Math.abs(dy)<10){
        var el=t.g&&page().elements.find(function(x){return x.id===t.g.dataset.id});
        if(el&&el.action==='goto'&&el.target)goPageByName(el.target);
        else if(el&&el.action&&el.action!=='none')toast('Fonction : '+(ACTIONS.find(function(a){return a[0]===el.action})||[0,el.action])[1]);
      }else if(Math.abs(dx)>40&&Math.abs(dy)<60){
        if(dx>0){
          var cads=S.pages.map(function(p,i){return p.kind==='cadran'?i:-1}).filter(function(i){return i>=0}),pos=cads.indexOf(S.cur);
          S.cur=cads.length?cads[(pos+1)%cads.length]:S.cur;S.sel=null;renderAll();
        }else ACT.testBtn();
      }
      return;
    }
    if(drag){var m=drag.moved;drag=null;if(m){commit();renderPages();renderProps()}}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  document.addEventListener('keydown',function(e){
    var t=e.target,tag=t&&t.tagName;if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
    var mod=e.ctrlKey||e.metaKey;
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
    if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();ACT.dupEl();return}
    var el=selEl();if(!el||el.lock||S.test)return;
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();ACT.delEl();return}
    var st=e.shiftKey?10:1,mv=false;
    if(e.key==='ArrowLeft'){el.x-=st;mv=true}else if(e.key==='ArrowRight'){el.x+=st;mv=true}else if(e.key==='ArrowUp'){el.y-=st;mv=true}else if(e.key==='ArrowDown'){el.y+=st;mv=true}
    if(mv){e.preventDefault();renderContent();renderOverlay();syncGeo();commit();renderPages()}
  });
  $('#fileImg').addEventListener('change',function(e){
    var f=e.target.files[0];e.target.value='';if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var m=Math.min(1,240/Math.max(im.width,im.height)),cw=Math.max(1,Math.round(im.width*m)),ch=Math.max(1,Math.round(im.height*m));
        var c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(im,0,0,cw,ch);
        var src=c.toDataURL('image/png'),sel=selEl(),tgt;
        if(sel&&sel.type==='image'){sel.orig=src;sel.src=src;sel.w=Math.min(sel.w,cw);sel.h=Math.round(sel.w*ch/cw);tgt=sel}
        else{var sc=Math.min(1,160/Math.max(cw,ch)),el=mkEl('image',{src:src,orig:src,w:Math.round(cw*sc),h:Math.round(ch*sc)});el.x=Math.round((240-el.w)/2);el.y=Math.round((240-el.h)/2);page().elements.push(el);S.sel=el.id;tgt=el}
        procImage(tgt,function(){commit();renderAll();toast('Image importée. Dans Élément : fond transparent, couleur, rythme.',4000)});
      };
      im.onerror=function(){toast('Image illisible')};
      im.src=r.result;
    };
    r.readAsDataURL(f);
  });
  $('#fileJson').addEventListener('change',function(e){
    var f=e.target.files[0];e.target.value='';if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        if(o.kind==='rnk-project'&&Array.isArray(o.pages)){S.name=o.name||S.name;if(o.themes)S.themes=o.themes;S.themeId=o.themeId&&S.themes[o.themeId]?o.themeId:'brique';S.pages=o.pages;S.cur=0;S.sel=null;commit();renderAll();preloadImages(function(){renderAll()});toast('Projet importé')}
        else if(o.kind==='rnk-page'&&o.page){
          if(o.themes){Object.keys(o.themes).forEach(function(k){if(!S.themes[k])S.themes[k]=o.themes[k]})}
          var p=o.page;p.id=uid();p.elements.forEach(function(x){x.id=uid()});addPage(p);preloadImages(function(){renderAll()});toast('Cadran importé');
        }else toast('Ce fichier n’est pas un cadran de l’atelier');
      }catch(x){toast('Fichier JSON invalide')}
    };
    r.readAsText(f);
  });
  setInterval(function(){if((S.live||S.test)&&!drag)renderContent()},1000);
}

/* ========== Démarrage ========== */
function init(){
  var loaded=false;
  try{
    var raw=localStorage.getItem(STORE);
    if(raw){var o=JSON.parse(raw);if(o&&Array.isArray(o.pages)&&o.pages.length){S.name=o.name||S.name;S.themes=o.themes||S.themes;S.themeId=o.themeId||'brique';S.pages=o.pages;S.cur=Math.min(o.cur||0,o.pages.length-1);loaded=true}}
  }catch(e){}
  if(!loaded)defaultProject();
  if(window.innerWidth<640)S.zoom=1.25;
  else if(window.innerWidth<1180)S.zoom=1.5;
  H.stack=[snap()];H.i=0;
  initEvents();renderAll();preloadImages(function(){renderAll()});
}
if(typeof document==='undefined'){
  globalThis.__rnk={TPLS:TPLS,renderPage:renderPage,compile:compile,THEMES0:THEMES0,mkEl:mkEl,S:S,defaultProject:defaultProject,FIELDS:FIELDS,DEF:DEF,fieldHTML:fieldHTML,LABEL:LABEL};
}else{init()}
</script>
