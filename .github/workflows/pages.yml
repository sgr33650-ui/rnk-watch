name: Publier le site et le firmware
on:
  push:
    branches: [main]
    paths: ['docs/**', 'firmware/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compiler le firmware (le site est publié même si cette étape échoue)
        run: |
          mkdir -p docs/firmware
          pip install platformio esptool > pip.log 2>&1 || { echo "::error title=pip::$(tail -c 900 pip.log | tr '\n' '|')"; exit 0; }
          cd firmware
          if ! pio run > ../build.log 2>&1; then
            echo "::error title=compilation::$(grep -iE 'error|fatal|undefined|not found' ../build.log | head -12 | cut -c1-300 | tr '\n' '|')"
            echo "::error title=fin du journal::$(tail -n 8 ../build.log | cut -c1-300 | tr '\n' '|')"
            exit 0
          fi
          P=~/.platformio/packages/framework-arduinoespressif32
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          BJ=$(find ~/.platformio/platforms -name ttgo-t-watch.json | head -1)
          MODE=$(python3 -c "import json,sys;d=json.load(open('$BJ'))['build'];print(d.get('flash_mode','dio'))")
          FREQ=$(python3 -c "import json,sys;d=json.load(open('$BJ'))['build'];print(str(d.get('f_flash','40000000L')).rstrip('L')[:-6]+'m')")
          BL=$P/tools/sdk/bin/bootloader_${MODE}_${FREQ}.bin
          if [ ! -f "$BL" ]; then BL=$(find $P/tools/sdk -name 'bootloader_dio_40m.bin' | head -1); MODE=dio; FREQ=40m; fi
          echo "::notice title=carte::mode=$MODE freq=$FREQ BL=$BL json=$(python3 -c "import json;print(json.load(open('$BJ'))['build'])" | cut -c1-400)"
          for E in twatch2020v3 diag; do
            B=.pio/build/$E
            OUT=rnk-runtime.bin; [ "$E" = diag ] && OUT=diag.bin
            if [ ! -f "$B/firmware.bin" ]; then echo "::error title=$E::pas de firmware.bin"; continue; fi
            if [ ! -f "$B/partitions.bin" ]; then
              CSV=$(find $P/tools/partitions -name default.csv | head -1)
              python3 $P/tools/gen_esp32part.py "$CSV" $B/partitions.bin > ../gen.log 2>&1 || echo "::error title=partitions::$(tail -c 600 ../gen.log | tr '\n' '|')"
            fi
            if ! esptool.py --chip esp32 merge_bin -o ../docs/firmware/$OUT --flash_mode $MODE --flash_freq $FREQ --flash_size 16MB 0x1000 "$BL" 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin > ../merge.log 2>&1; then
              echo "::error title=fusion-$E::$(tail -c 700 ../merge.log | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' '|')"
            fi
          done

      - name: Manifeste du firmware
        run: |
          mkdir -p docs/firmware
          if [ -f docs/firmware/rnk-runtime.bin ]; then
            echo '{"name":"RNK Runtime","version":"0.3.1","new_install_prompt_erase":false,"builds":[{"chipFamily":"ESP32","parts":[{"path":"rnk-runtime.bin","offset":0}]}]}' > docs/firmware/manifest.json
          fi
          if [ -f docs/firmware/diag.bin ]; then
            echo '{"name":"RNK Test","version":"diag","new_install_prompt_erase":false,"builds":[{"chipFamily":"ESP32","parts":[{"path":"diag.bin","offset":0}]}]}' > docs/firmware/manifest-diag.json
          else
            echo "Compilation du firmware échouée : pas de page d'installation."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
