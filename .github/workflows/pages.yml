name: Publier le site et le firmware
on:
  push:
    branches: [main]
    paths: ['docs/**', 'firmware/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compiler le firmware (le site est publié même si cette étape échoue)
        continue-on-error: true
        run: |
          pip install platformio esptool
          cd firmware && pio run
          B=.pio/build/twatch2020v3
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          esptool.py --chip esp32 merge_bin -o ../docs/firmware/rnk-runtime.bin \
            --flash_mode dio --flash_size keep \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin
      - name: Manifeste du firmware
        run: |
          mkdir -p docs/firmware
          if [ -f docs/firmware/rnk-runtime.bin ]; then
            echo '{"name":"RNK Runtime","version":"0.3","new_install_prompt_erase":false,"builds":[{"chipFamily":"ESP32","parts":[{"path":"rnk-runtime.bin","offset":0}]}]}' > docs/firmware/manifest.json
          else
            echo "Compilation du firmware échouée : pas de page d'installation."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
