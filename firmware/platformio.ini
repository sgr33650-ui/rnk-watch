; RNK Runtime pour LilyGO T-Watch 2020 V3
[env:twatch2020v3]
platform = espressif32@3.5.0
board = ttgo-t-watch
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<diag/>
lib_deps =
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git
    bblanchon/ArduinoJson@^6.21.5

[env:diag]
extends = env:twatch2020v3
build_src_filter = -<*> +<diag/>
